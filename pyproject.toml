[project]
name = "copy-backlog-issues-to-github"
version = "0.1.0"
description = "Backlogプロジェクトの課題をGitHubリポジトリのIssueにコピーするツール"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "niquests>=3.21.2",
]

[project.scripts]
copy-backlog-issues-to-github = "copy_backlog_issues_to_github.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copy_backlog_issues_to_github"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
